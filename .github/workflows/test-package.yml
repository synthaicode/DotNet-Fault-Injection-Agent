name: Publish and verify test package
on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Candidate version to verify through GitHub Packages (empty creates a unique test version)'
        required: false
        type: string
  push:
    branches: ['package-test/**']

permissions:
  contents: read
  packages: write

jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/CLRInstrumentationEngine
          ref: 0055c6fce2fe16770f5908ef14cfd7f8a42c2fab
          path: artifacts/engine-source
          persist-credentials: false
      - name: Build Linux runtime from source
        run: |
          docker build -t fault-linux-build -f src/Native/Linux/Build/Dockerfile src/Native/Linux/Build
          docker run --rm --mount "type=bind,source=$PWD,target=/repo" fault-linux-build bash /repo/tools/Build-LinuxRuntime.sh /repo/artifacts/engine-source
      - uses: actions/upload-artifact@v4
        with:
          name: linux-runtime
          path: artifacts/runtime/linux-x64/*
  windows-package:
    needs: linux-runtime
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: actions/checkout@v4
        with:
          repository: microsoft/CLRInstrumentationEngine
          ref: 0055c6fce2fe16770f5908ef14cfd7f8a42c2fab
          path: artifacts/engine-source
          persist-credentials: false
      - name: Prepare pinned JSON headers
        run: |
          New-Item -ItemType Directory -Force artifacts/headers/nlohmann | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/nlohmann/json/v3.11.3/single_include/nlohmann/json.hpp -OutFile artifacts/headers/nlohmann/json.hpp
      - name: Build Windows runtime from source
        run: |
          $headers = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/NETFXSDK" -Directory |
            Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'Include/um' } |
            Where-Object { Test-Path (Join-Path $_ 'cor.h') } | Select-Object -First 1
          if (-not $headers) { throw '.NET Framework SDK native headers are required.' }
          ./tools/Build-WindowsRuntime.ps1 -EngineSource ./artifacts/engine-source -ClrHeaders $headers -JsonHeaders ./artifacts/headers
      - uses: actions/download-artifact@v4
        with:
          name: linux-runtime
          path: artifacts/runtime/linux-x64
      - name: Pack and verify locally
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.package_version }}
        run: |
          $version = "0.1.0-github.${env:GITHUB_RUN_ID}.${env:GITHUB_RUN_ATTEMPT}"
          if ($env:REQUESTED_VERSION) {
            if ($env:REQUESTED_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid package version.' }
            $version = $env:REQUESTED_VERSION
          }
          "TEST_PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          ./tools/Pack.ps1 -Version $version -CandidateOnly
          ./tools/Test-Package.ps1 -Package "./artifacts/packages/DotNetFaultInjectionAgent.Tool.$version.nupkg"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-verification
          path: |
            artifacts/packages/*.nupkg
            artifacts/package-tests/*/summary.json
            artifacts/package-tests/*/*-result.json
            artifacts/runtime/*/manifest.json
          if-no-files-found: warn

  scan-and-publish:
    needs: windows-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: package-verification
          path: artifacts/github-published
      - name: Update virus definitions
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Scan archive and extracted payload before publication
        shell: pwsh
        env:
          TEST_PACKAGE_VERSION: ${{ needs.windows-package.outputs.version }}
        run: |
          ./tools/Scan-Package.ps1 -Package "./artifacts/github-published/packages/DotNetFaultInjectionAgent.Tool.$env:TEST_PACKAGE_VERSION.nupkg"
      - name: Publish scanned package to GitHub Packages
        shell: pwsh
        env:
          TEST_PACKAGE_VERSION: ${{ needs.windows-package.outputs.version }}
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = "./artifacts/github-published/packages/DotNetFaultInjectionAgent.Tool.$env:TEST_PACKAGE_VERSION.nupkg"
          $scan = Get-Content -Raw (Get-ChildItem artifacts/package-scans -Filter summary.json -Recurse | Select-Object -First 1).FullName | ConvertFrom-Json
          if ($scan.Result -ne 'passed' -or $scan.Sha256 -ne (Get-FileHash $package).Hash) { throw 'Missing or mismatched virus scan.' }
          dotnet nuget push $package --source https://nuget.pkg.github.com/synthaicode/index.json --api-key $env:PACKAGE_TOKEN --timeout 120
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Packages publish failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-virus-scan
          path: |
            artifacts/package-scans/*/summary.json
            artifacts/package-scans/*/scan.log

  windows-consumer:
    needs: [windows-package, scan-and-publish]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: package-verification
          path: artifacts/github-published
      - name: Fetch scanned package and verify Windows execution
        shell: pwsh
        env:
          TEST_PACKAGE_VERSION: ${{ needs.windows-package.outputs.version }}
          NuGetPackageSourceCredentials_packagefeed: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: |
          ./tools/Test-Package.ps1 -Package "./artifacts/github-published/packages/DotNetFaultInjectionAgent.Tool.$env:TEST_PACKAGE_VERSION.nupkg" -SourceUrl https://nuget.pkg.github.com/synthaicode/index.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-consumer-verification
          path: |
            artifacts/package-tests/*/summary.json
            artifacts/package-tests/*/*-result.json

  linux-consumer:
    needs: [windows-package, scan-and-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: package-verification
          path: artifacts/github-published
      - name: Fetch package from GitHub and execute Linux payload
        env:
          TEST_PACKAGE_VERSION: ${{ needs.windows-package.outputs.version }}
          NuGetPackageSourceCredentials_packagefeed: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: |
          ./tools/Test-Package.ps1 -Package "./artifacts/github-published/packages/DotNetFaultInjectionAgent.Tool.$env:TEST_PACKAGE_VERSION.nupkg" -SourceUrl https://nuget.pkg.github.com/synthaicode/index.json
      - name: Run independent injection suite using exported payload
        run: |
          $summaryPath = Get-ChildItem artifacts/package-tests -Filter summary.json -Recurse | Select-Object -First 1
          $summary = Get-Content -Raw $summaryPath.FullName | ConvertFrom-Json
          $env:FAULT_RUNTIME_DIRECTORY = $summary.RuntimeDirectory
          docker build -t dotnet-fault-injection-runtime:local src/Native/Linux
          python3 tests/PlanDrivenInjection/verify.py dotnet-fault-injection-runtime:local
          if ($LASTEXITCODE -ne 0) { throw 'Exported Linux runtime suite failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-consumer-verification
          path: |
            artifacts/package-tests/*/summary.json
            artifacts/package-tests/*/linux-runtime.log
            tests/PlanDrivenInjection/artifacts/*/summary.json
